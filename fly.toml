# Fly.io: `fly launch --copy-config` once, then `fly deploy`.
# Create the volume first: fly volumes create ultrachess_data --size 1
app = "ultrachess"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  DB_FILE = "/data/ultrachess.db"
  # Links in letters point here; set the mail key with
  # `fly secrets set RESEND_API_KEY=... MAIL_FROM="Ultrachess <no-reply@your-domain>"`.
  # PUBLIC_URL (a secret: https://ultrachess.app): with it set, pages on *.fly.dev redirect there.

# Small and cheap: fine for a class (the server with one bot thread uses ~160 MB).
# For 500–1000 players online (load test, docs/networking.md#масштаб) 512 MB is too
# little (~560 MB at 1000 sockets): use memory = "1gb" or more and dedicated cores,
# e.g. cpu_kind = "performance", cpus = 4 (measured: bot answers ~1 s at the peak);
# with fewer cores the strong bots think shorter at the peak, 8 keeps their full time.
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "ultrachess_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Every open game tab holds a WebSocket: count connections, with room for a
  # whole class at once, instead of the low default limits.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 1200
    hard_limit = 1500

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
