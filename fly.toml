# Fly.io: `fly launch --copy-config` once, then `fly deploy`.
# Create the volume first: fly volumes create ultrachess_data --size 1
app = "ultrachess"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  DB_FILE = "/data/ultrachess.db"
  # Links in letters point here; set the mail key with
  # `fly secrets set RESEND_API_KEY=... MAIL_FROM="Ultrachess <no-reply@your-domain>"`.
  # PUBLIC_URL = "https://ultrachess.fly.dev"

# The server with one bot thread uses ~160 MB; 256 MB (the default) leaves too little headroom.
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "ultrachess_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Every open game tab holds a WebSocket: count connections, with room for a
  # whole class at once, instead of the low default limits.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
